<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white">

   

    <main class="flex justify-center items-center min-h-screen px-4">
         
        <fieldset class="bg-gray-100 p-5 rounded-2xl shadow-lg w-full mt-1 max-w-md">
           
            <h1 class="text-4xl font-extrabold text-center text-red-900 tracking-wide mb-2">
                Welcome Back
            </h1>

            <p class="text-center text-gray-600 text-sm mb-8">
                Login to access your Ruby Residence account
            </p>

           <form class="">

            <div class="flex flex-col">
                <label for="email" class="block mb-3 text-md font-bold tracking-wide text-red-900 uppercase"> Email:</label>
                <input type="email" placeholder="example123@gmail.com" class="border border-gray-300 p-3 rounded-xl" name="email" required><br><br>
            </div>
            <div class="flex flex-col">
                <label for="housenumber" class="block mb-3 text-md font-bold tracking-wide text-red-900 uppercase"> House Number:</label>
                <input type="text" placeholder="000" class="border border-gray-300 p-3 rounded-xl" name="housenumber" required><br><br>
            </div>
             
            <div class="flex flex-col">
                <label for="password" class="block mb-3 text-md font-bold tracking-wide text-red-900 uppercase"> Password:</label>
                <input type="password"  placeholder="********" class="border border-gray-300 p-3 rounded-xl" name="password"><br><br>
            </div>
               <!-- REMEMBER + FORGOT -->
                <div class="flex justify-between items-center mb-6">

                    <div class="flex items-center gap-2 text-red-950">
                        <input type="checkbox" id="remember">
                        <label for="remember" class=" text-md">
                            Remember Me
                        </label>
                    </div>

                    <a href="#" class="text-red-950 text-md hover:underline">
                        Forgot Password?
                    </a>
                    <p class="text-center text-white text-sm mt-6">

                </div>
                <p>                 
                    Don't have an account?
                    <a href="signup.html" class="text-blue-500 font-semibold hover:underline">
                     Register here
                   </a>
                   </p><br>

                <a href=" tenantdashboard.html">
                <button 
                   class=" bg-red-900 w-full text-white p-3 block mx-auto rounded-xl hover:bg-gray-800 "
                >
                   Login
                </button>
                </a>
                
            </form>
        </fieldset>
    </main>
</body>
</html>
