<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://kit.fontawesome.com/3f286a15d5.js"></script>
</head>

<body class="bg-gray-100">

<!-- MOBILE TOP BAR -->
<div class="md:hidden bg-red-900 text-white flex justify-between items-center p-4">


  <button id="menuBtn" class="text-2xl">
    <i class="fa-solid fa-bars"></i>
  </button>

</div>

<!-- TOP NAVBAR -->
<header class="bg-red-900 text-white">

  <div class="max-w-7xl mx-auto p-4">

    <!-- FLEX CONTAINER -->
    <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4">

      <!-- LOGO -->
      <h1 class="text-2xl font-bold tracking-widest uppercase text-center md:text-left">
        Ruby Residence
      </h1>

    </div>

  </div>

</header>

<!-- OVERLAY -->
<div id="overlay"
class="hidden fixed inset-0 bg-black bg-opacity-70 z-40">
</div>

<!-- PAGE LAYOUT -->
<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside id="sidebar"
  class="fixed  w-64 h-screen bg-red-950 text-white p-6 space-y-6 transform -translate-x-full md:translate-x-0 md:static md:block transition duration-300 z-50">

    <h2 class="text-2xl font-bold">
      Admin Menu
    </h2>

    <nav class="space-y-4 text-sm">

       <a href="index.html" class="block hover:text-yellow-300">
        <i class="fa-solid fa-house mr-2"></i>
           Home
        </a>
    
           <a href="#notices" class="block hover:text-yellow-300">
            <i class="fa-solid fa-circle-exclamation mr-2"></i>
            Post notice
          </a>
  

        <a href="#bills" class="block hover:text-yellow-300">
          <i class="fa-solid fa-money-bill mr-2"></i>
            Add bills
          </a>
        

      <a href="#dashboard" class="block hover:text-yellow-300">
        <i class="fa-solid fa-gauge mr-2"></i>
        Dashboard
      </a>

      <a href="tenants.html" class="block hover:text-yellow-300">
        <i class="fa-solid fa-users mr-2"></i>
        Tenants
      </a>

      <a href="payments.html" class="block hover:text-yellow-300">
        <i class="fa-solid fa-money-bill mr-2"></i>
        Payments
      </a>

      <a href="adminissues.html" class="block hover:text-yellow-300">
        <i class="fa-solid fa-screwdriver-wrench mr-2"></i>
        Reported Issues
      </a>

      <a href="index.html" class="block hover:text-yellow-300 mt-6">
        Logout
      </a>
    </nav>

  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-6 space-y-8">

    <!-- WELCOME -->
    <section id="dashboard" class="bg-white rounded-xl shadow p-6">

      <h2 class="text-3xl font-bold text-red-900">
        Welcome to your dashboard Admin<i class="fa-solid fa-face-smile"></i>
      </h2>

      <p class="text-gray-600 mt-2">
        Manage tenants, payments, notices, and apartment issues.
      </p>

    </section>

    <!-- SUMMARY CARDS -->
    <section class="grid md:grid-cols-4 gap-6">

      <div class="bg-white p-6 rounded-xl shadow">
        <p class="text-gray-500 text-sm">Total Tenants</p>
        <h3 id="totalTenants" class="text-3xl font-bold text-red-900 mt-2" ></h3>
      </div>
      <div class="bg-white p-6 rounded-xl shadow">
        <p class="text-gray-500 text-sm">Total Houses</p>
        <h3 id="totalHouses" class="text-3xl font-bold text-red-900 mt-2" ></h3>
      </div>

      <div class="bg-white p-6 rounded-xl shadow">
        <p class="text-gray-500 text-sm">Occupied Units</p>
        <h3 id="occupiedUnits" class="text-3xl font-bold text-red-900 mt-2">0</h3>
      </div>

      <div class="bg-white p-6 rounded-xl shadow">
        <p class="text-gray-500 text-sm">Vacant Houses</p>
        <h3 id="vacantHouses" class="text-3xl font-bold text-red-900 mt-2"></h3>
      </div>

    </section>

    <!-- ADD BILLS SECTION -->
     <section id="bills">
<div class="bg-white rounded-xl shadow p-6 mt-8">

  <h2 class="text-2xl font-bold text-red-900 mb-6">
    Add Monthly Bill
  </h2>

  <form class="grid grid-cols-1 md:grid-cols-2 gap-6 " id="billForm">

    <!-- TENANT NAME -->
    <div>
      <label class="block text-sm font-semibold mb-2">
        Tenant Name
      </label>

      <input 
      type="text"
      placeholder="Enter tenant name"
       id="tenantName"
      class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-900">
    </div>

    <!-- HOUSE NUMBER -->
    <div>
      <label class="block text-sm font-semibold mb-2">
        House Number
      </label>

      <input 
      type="text"
      placeholder="e.g B12"
      id="houseNumber"
      class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-900">
    </div>

    <!-- MONTH -->
    <div>
      <label class="block text-sm font-semibold mb-2">
        Month
      </label>

      <select class="w-full border rounded-lg p-3  focus:outline-none focus:ring-2 focus:ring-red-900"  
      id="billMonth">

        <option>January</option>
        <option>February</option>
        <option>March</option>
        <option>April</option>
        <option>May</option>
        <option>June</option>
        <option>July</option>
        <option>August</option>
        <option>September</option>
        <option>October</option>
        <option>November</option>
        <option>December</option>
        

      </select>
    </div>

    <!-- BILL TYPE -->
    <div>
      <label class="block text-sm font-semibold mb-2">
        Bill Type
      </label>

      <select class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-900"
       id="billType">

        <option>Rent</option>
        <option>Water</option>
        <option>Electricity</option>
        <option>Garbage</option>

      </select>
    </div>

    <!-- AMOUNT -->
    <div>
      <label class="block text-sm font-semibold mb-2">
        Amount (Ksh)
      </label>

      <input 
      type="number"
      placeholder="Enter amount"
      class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-900" 
      id="billAmount">
    </div>

    <!-- STATUS -->
    <div>
      <label class="block text-sm font-semibold mb-2">
        Payment Status
      </label>

      <select class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-900"
      id="paymentStatus"
      >

        <option>Paid</option>
        <option>Pending</option>
        <option>Unpaid</option>

      </select>
    </div>

    <!-- BUTTON -->
    <div class="md:col-span-2">
      <button type="submit"
      class="bg-red-900 text-white px-6 py-3 rounded-lg hover:bg-red-800 w-full md:w-auto"
       id="addBillBtn"
      
      >
        Add Bill

      </button>
    </div>

  </form>

</div>

    </section>

    <!-- NOTICE SECTION -->
    <section id="notices" class="bg-white rounded-xl shadow p-6">

      <h2 class="text-2xl font-bold text-red-900 mb-4">
        Post Notice
      </h2>

      <form class="space-y-4" id="noticeForm">

        <input type="text"
        placeholder="Notice title"
        id="noticeTitle"
        class="w-full border border-gray-300 p-3 rounded-lg">

        <textarea rows="4"
        id="noticeText"
        placeholder="Write notice..."
        class="w-full border border-gray-300 p-3 rounded-lg"></textarea>

        <button type="submit" id="postNoticeBtn"   class="bg-red-900 text-white px-6 py-3 rounded-lg hover:bg-red-800">
          Publish Notice
        </button>

      </form>

    </section>

  </main>

</div>

<!-- SCRIPT -->
<script>

const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

function toggleMenu() {

  sidebar.classList.toggle("-translate-x-full");
  overlay.classList.toggle("hidden");

}

menuBtn.addEventListener("click", toggleMenu);
overlay.addEventListener("click", toggleMenu);

</script>
<script src="js-files/admindash.js" type="module"></script>

</body>
</html>
