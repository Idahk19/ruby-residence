<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reported Issues - Ruby Residence</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://kit.fontawesome.com/3f286a15d5.js"></script>
</head>

<body class="bg-gray-100">
    <header class="bg-red-900 text-white p-4 flex justify-between items-center">

  <button id="menuBtn" class="md:hidden text-2xl">
    <i class="fa-solid fa-bars"></i>
  </button>

</header>

<!-- OVERLAY -->
<div id="overlay"
class="hidden fixed inset-0 bg-black bg-opacity-70 z-40"></div>

<!-- LAYOUT -->
<div class="flex min-h-screen">

<!-- SIDEBAR -->
<aside id="sidebar"
class="fixed  w-64 h-screen bg-red-950 text-white p-6 transform -translate-x-full md:translate-x-0 md:static transition duration-300 z-50">

<h2 class="text-2xl font-bold mb-8">Admin Menu</h2>

<nav class="space-y-4 text-sm">

<a href="admindashboard.html" class="block hover:text-yellow-300">Dashboard</a>

<a href="tenants.html" class="block hover:text-yellow-300 font-semibold">Tenants</a>

<a href="payments.html" class="block hover:text-yellow-300">Payments</a>

<a href="reported_issues.html" class="block hover:text-yellow-300">Reported Issues</a>

<a href="index.html" class="block hover:text-yellow-300 mt-6">Logout</a>

</nav>

</aside>
<!-- ISSUE CARD WRAPPER -->
<div class="space-y-6 ml-10 ">

<!-- ISSUE 1 -->
<div class="bg-white p-5 rounded-lg shadow border-l-4 border-yellow-500">

  <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-2">
    
    <h3 class="font-bold text-lg">Broken Water Tap</h3>

    <span class="text-sm md:text-base font-semibold text-gray-800">
      House: B12
    </span>
  </div>

  <p class="text-gray-600 mt-3 text-sm md:text-base">
    Water tap in kitchen is leaking and needs replacement.
  </p>

  <!-- BUTTONS -->
  <div class="flex flex-col md:flex-row gap-3 mt-4">

    <button class="w-full md:w-auto bg-red-900 text-white px-4 py-2 rounded hover:bg-red-800">
      Reply
    </button>

    <button class="w-full md:w-auto bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
      Mark as resolved
    </button>

  </div>

</div>

<!-- ISSUE 2 -->
<div class="bg-white p-5 rounded-lg shadow border-l-4 border-green-500">

  <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-2">
    
    <h3 class="font-bold text-lg">Electricity Issue</h3>

    <span class="text-sm md:text-base font-semibold text-gray-800">
      House: A02
    </span>
  </div>

  <p class="text-gray-600 mt-3 text-sm md:text-base">
    Power outage in the bedroom socket.
  </p>

  <div class="flex flex-col md:flex-row gap-3 mt-4">

    <button class="w-full md:w-auto bg-red-900 text-white px-4 py-2 rounded hover:bg-red-800">
      Reply
    </button>

    <button class="w-full md:w-auto bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
      Mark as resolved
    </button>

  </div>

</div>

<!-- ISSUE 3 -->
<div class="bg-white p-5 rounded-lg shadow border-l-4 border-red-500">

  <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-2">
    
    <h3 class="font-bold text-lg">Noise Complaint</h3>

    <span class="text-sm md:text-base font-semibold text-gray-800">
      House: C10
    </span>
  </div>

  <p class="text-gray-600 mt-3 text-sm md:text-base">
    Loud music from neighbor during late hours.
  </p>

  <div class="flex flex-col md:flex-row gap-3 mt-4">

    <button class="w-full md:w-auto bg-red-900 text-white px-4 py-2 rounded hover:bg-red-800">
      Reply
    </button>

    <button class="w-full md:w-auto bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
      Mark as resolved
    </button>

  </div>

</div>

</div>
<!-- SCRIPT -->
<script>

const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

function toggleMenu() {
  sidebar.classList.toggle("-translate-x-full");
  overlay.classList.toggle("hidden");
}

menuBtn.addEventListener("click", toggleMenu);
overlay.addEventListener("click", toggleMenu);

</script>


</body>
</html>
