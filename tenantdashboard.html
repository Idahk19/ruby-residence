<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruby Residence Dashboard</title>

<script src="https://kit.fontawesome.com/3f286a15d5.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- HEADER -->
<header class="bg-red-900 text-white p-4">
    <h1 class="text-xl font-bold text-center">
        Ruby Residence 
    </h1>
</header>

<!-- MOBILE TOP BAR -->
<div class="md:hidden bg-red-900 text-white flex justify-between items-center p-4">
    <button id="menuBtn" class="text-2xl">
        <i class="fa-solid fa-bars"></i>
    </button>
</div>

<!-- OVERLAY -->
<div id="overlay"
class="hidden fixed inset-0 bg-black bg-opacity-70 z-40"></div>

<!-- MAIN LAYOUT -->
<div class="flex flex-col md:flex-row min-h-screen">

<!-- SIDEBAR -->
<aside id="sidebar"
class="fixed w-64 h-full bg-gradient-to-b from-red-950 to-red-900 text-white p-6
space-y-6 transform -translate-x-full md:translate-x-0 md:static
transition duration-300 z-50 shadow-xl">

   

    <!-- MENU -->
    <nav class="space-y-2 text-sm">

        <a href="index.html"
           class="flex items-center gap-3 p-3 rounded-lg hover:bg-red-800 transition">
            <i class="fa-solid fa-house"></i> Home
        </a>

        <a href="contact.html"
           class="flex items-center gap-3 p-3 rounded-lg hover:bg-red-800 transition">
            <i class="fa-solid fa-message"></i> Report Issues
        </a>

        <a href="notices.html"
           class="flex items-center gap-3 p-3 rounded-lg hover:bg-red-800 transition">
            <i class="fa-solid fa-bullhorn"></i> Notices
        </a>

        <a href="reported_issues.html"
           class="flex items-center gap-3 p-3 rounded-lg hover:bg-red-800 transition">
            <i class="fa-solid fa-triangle-exclamation"></i> Issues
        </a>


        <a href="index.html"
           class="flex items-center gap-3 p-3 rounded-lg hover:bg-red-700 text-red-200">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>

    </nav>

</aside>
<!-- MAIN CONTENT -->
<main class="flex-1 p-6 space-y-8">

    <!-- TENANT PROFILE CARD -->
    <div class="bg-white rounded-xl shadow p-6 border-l-4 border-red-900">

        <h2 id="welcomeUser"
            class="text-2xl font-bold text-red-900">
        </h2>

        <div class="mt-3 space-y-2 text-gray-600">
            <p id="userEmail"></p>
            <p id="userHouse"></p>
        </div>

    </div>

    <!-- BILL SECTION -->
    <section class="bg-white p-6 rounded-lg shadow">

        <h2 class="text-2xl font-bold text-red-900 mb-4">
            Tenant Monthly Bills
        </h2>

        <p class="text-gray-600 mb-4">
            Overview of rent and utility payments for this month
        </p>

        <div class="overflow-x-auto">
            <table class="w-full min-w-[600px] text-sm text-left border-collapse">

                <thead class="bg-red-900 text-white">
                    <tr>
                        <th class="p-3">Type</th>
                        <th class="p-3">Amount</th>
                        <th class="p-3">Status</th>
                        <th class="p-3">Due Date</th>
                    </tr>
                </thead>

                <tbody id="tenantBillsBody"></tbody>

            </table>
        </div>

    </section>

</main>

</div>

<!-- SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", () => {

    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    function toggleMenu() {
        sidebar.classList.toggle("-translate-x-full");
        overlay.classList.toggle("hidden");
    }

    if (menuBtn) menuBtn.addEventListener("click", toggleMenu);
    if (overlay) overlay.addEventListener("click", toggleMenu);

});
</script>

<script type="module" src="js-files/tenantdash.js"></script>

</body>
</html>
