<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
     <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class=" bg-white">

    <main class="flex justify-center items-center min-h-screen px-4">
        
        <fieldset class="bg-gray-100 text-red-900 p-5 rounded-2xl shadow-lg w-full max-w-md">

           <h1 class="text-xl font-bold text-center mb-6">Get Started now </h1>

               <form class="space-y-5" id="formInput">

                 <!-- First Name -->
                <div class="flex flex-col">
                <label for="fullname" class="mb-2 font-semibold">Full Name:</label>
                <input 
                    type="text" 
                    name="fullname" 
                    required
                    class="border border-gray-300 p-2 rounded-xl"
                    id="fullname"
                >
                </div>

             <!-- Email -->
            <div class="flex flex-col">

                <label for="email" class="mb-2 font-semibold">
                    Email:
                </label>

                <input 
                    type="email" 
                    name="email" 
                    required
                    class="border border-gray-300 p-3 rounded-xl "
                    id="emailInput"
                >
            </div>

            <!--housenumber -->
            <div class="flex flex-col">

                <label for="housenumber" class="mb-2 font-semibold">
                    Housenumber:
                </label>

                <input 
                    type="text" 
                    name="housenumber" 
                    required
                    class="border border-gray-300 p-3 rounded-xl "
                    id="houseNo"
                >

            </div>

            <!-- Password -->
            <div class="flex flex-col">

                <label for="password" class="mb-2 font-semibold">
                    Create Password:
                </label>

                <input 
                    type="password" 
                    name="password"
                    placeholder="********"
                    class="border border-gray-300 p-3 rounded-xl "
                    id="password"
                >
                <label class="flex items-center gap-2">
                <input type="checkbox" id="showPassword">
                  Show Password
                </label>

            </div>

            <!-- Repeat Password -->
            <div class="flex flex-col">

                <label for="password" class="mb-2 font-semibold">
                    Repeat Password:
                </label>

                <input 
                    type="password" 
                    name="confirmpassword"
                    placeholder="********"
                    class="border border-gray-300 p-3 rounded-xl "
                    id="repeatPassword"
                >
                <label class="flex items-center gap-2">
                <input type="checkbox" id="showPassword">
                  Show Password
                </label>
            <small id="passwordError" class="text-red-600"></small>
            </div>
             <p>                 
                    Already have an account?
                    <a href="tenantlogin.html" class="text-blue-500 font-semibold hover:underline">
                     Login here
                   </a>
                   </p><br>
                    <P>
                  <a href="index.html" class="text-blue-500">
                  Go back to home
                  </a>
                  </P>

            <!-- Button -->
            
            <button type ="submit"
                class="w-full bg-red-900 text-white p-3 block mx-auto rounded-xl hover:bg-red-800 "
            
                >
                Submit
            </button>
        

        </form>

    </fieldset>

</main>
<script src="js-files/main.js"></script>
</body>
<html>
