<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://kit.fontawesome.com/3f286a15d5.js"></script>
</head>

<body class="bg-gray-100 overflow-x-hidden">

<!-- TOP BAR -->
<div class=" md:hidden bg-red-900 text-white p-4 flex justify-between items-center">


  <button id="menuBtn" class="md:hidden text-2xl">
    <i class="fa-solid fa-bars"></i>
  </button>

</div>

<!-- OVERLAY -->
<div id="overlay" class="hidden fixed inset-0 bg-black bg-opacity-70 z-40"></div>

<!-- MAIN LAYOUT -->
<div class="flex flex-col md:flex-row min-h-screen overflow-x-hidden">

<!-- SIDEBAR -->
<aside id="sidebar"
class="fixed w-64 h-screen bg-red-950 text-white p-6 
transform -translate-x-full md:translate-x-0 md:static 
transition duration-300 z-50 overflow-y-auto">

<h2 class="text-2xl font-bold mb-8">Admin Menu</h2>

<nav class="space-y-4 text-sm">

<a href="admindashboard.html" class="block hover:text-yellow-300">Dashboard</a>
<a href="tenants.html" class="block hover:text-yellow-300">Tenants</a>
<a href="payments.html" class="block hover:text-yellow-300 font-semibold">Payments</a>
<a href="adminissues.html" class="block hover:text-yellow-300">Reported Issues</a>
<a href="index.html" class="block hover:text-yellow-300 mt-6">Logout</a>

</nav>
</aside>

<!-- CONTENT -->
<main class="flex-1 p-6 space-y-6 w-full">

<h2 class="text-3xl font-bold text-red-900">
Payments Overview
</h2>

<!-- TABLE WRAPPER -->
<div class="overflow-x-auto w-full bg-white text:sm rounded-lg shadow">

<table class="min-w-[900px] w-full text-sm text-left border">

<!-- HEADER -->

<table class="w-full text-sm text-left">
    <thead>
        <tr>
            <th>Tenant</th>
            <th>House</th>
            <th>Month</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Due Date</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody id="billsTableBody">
    </tbody>


</table>

</div>

</main>

</div>

<!-- SCRIPT -->
<script>
const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

function toggleMenu() {
  sidebar.classList.toggle("-translate-x-full");
  overlay.classList.toggle("hidden");
}

menuBtn.addEventListener("click", toggleMenu);
overlay.addEventListener("click", toggleMenu);
</script>

</body>
</html>
