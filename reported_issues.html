<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Issues</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://kit.fontawesome.com/3f286a15d5.js"></script>
</head>

<body class="bg-gray-100">



<header class="bg-red-900 text-white">
<nav class="bg-red-900 text-white">

  <div class="max-w-3xl mx-auto p-2">

    <!-- WELCOME -->
    <p class="text-lg font-bold text-center">
      
    </p>

    <!-- NAV LINKS -->
    <ul class="flex justify-center gap-6 text-md mt-3">

      <li><a href="index.html" class="hover:text-yellow-300">Home</a></li>
      <li><a href="about.html" class="hover:text-yellow-300">About</a></li>
      <li><a href="contact.html" class="hover:text-yellow-300">Report Issues</a></li>

    </ul>

  </div>

</nav>

</header>

<!-- MOBILE TOP BAR -->
<div class="md:hidden bg-red-900 text-white flex justify-between items-center p-4">
  

  <button id="menuBtn" class="text-2xl">
    <i class="fa-solid fa-bars"></i>
  </button>

</div>

<!-- OVERLAY BACKDROP -->
<div id="overlay" class="hidden ">

<!-- SIDEBAR -->
<aside id="sidebar"
  class="fixed  w-64 h-full bg-red-950 text-white p-6 space-y-6 transform -translate-x-full md:translate-x-0 md:static md:h-auto transition duration-300 ">

  <h2 class="text-xl font-bold">Idah's Menu</h2>

  <nav class="space-y-4 text-sm">

    <a href="./tenantdashboard.html" class="block hover:text-yellow-300">
      <i class="fa-solid fa-gauge mr-2"></i> Dashboard
    </a>

    <a href="notices.html" class="block hover:text-yellow-300">
      <i class="fa-solid fa-bullhorn mr-2"></i> Notices
    </a>

    <a href="adminissues.html" class="block hover:text-yellow-300">
      <i class="fa-solid fa-triangle-exclamation mr-2"></i> Reported Issues
    </a>

    <a href="index.html" class="block hover:text-yellow-300 mt-6">
      Logout
    </a>

  </nav>

</aside>
</div>

<!-- MAIN CONTENT -->
<main class="flex-1 p-6 space-y-6">

  <!-- PAGE TITLE -->
  <div>
    <h2 class="text-3xl font-bold text-center text-red-900">
      My Reported Issues
    </h2>

    <p class="text-gray-600 text-center mt-2">
      Track reported apartment issues and management responses.
    </p>
  </div>

   <div class="bg-white shadow rounded-lg w-full overflow-x-auto">

    <table class="min-w-[900px] w-full text-sm text-left border-collapse">

      <!-- HEADER -->
      <thead class="bg-red-900 text-white">
        <tr>
       
          <th class="p-3">Subject</th>
          <th class="p-3">Message</th>
          <th class="p-3">Date</th>
          <th class="p-4">Action</th>
        </tr>
      </thead>

      <tbody id="issuesTableBody"></tbody>

    </table>

  </div>

</main>

<!-- SCRIPT -->
<script>
  const menuBtn = document.getElementById("menuBtn");
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");

  function toggleMenu() {
    sidebar.classList.toggle("-translate-x-full");
    overlay.classList.toggle("hidden");
  }

  menuBtn.addEventListener("click", toggleMenu);
  overlay.addEventListener("click", toggleMenu);
</script>
<script src="js-files/tenantissuesdash.js" type="module"></script>
</body>
</html>
