<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reported Issues - Ruby Residence</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://kit.fontawesome.com/3f286a15d5.js"></script>
</head>

<body class="bg-gray-100">
   <header class="bg-red-900 text-white p-4 relative flex items-center">

  <!-- MENU BUTTON -->
  <button id="menuBtn" class="md:hidden text-2xl absolute left-4">
    <i class="fa-solid fa-bars"></i>
  </button>

  <!-- CENTERED TITLE -->
  <p class="text-2xl font-bold w-full text-center">
    Reported Issues
  </p>

</header>

<!-- OVERLAY -->
<div id="overlay"
class="hidden fixed inset-0 bg-black bg-opacity-70 z-40"></div>

<!-- LAYOUT -->
<div class="flex min-h-screen">

<!-- SIDEBAR -->
<aside id="sidebar"
class="fixed  w-64 h-screen bg-red-950  text-white p-6 transform -translate-x-full md:translate-x-0 md:static transition duration-300 z-50">

<h2 class="text-2xl font-bold mb-8">Admin Menu</h2>

<nav class="space-y-4 text-sm">

<a href="admindashboard.html" class="block hover:text-yellow-300">Dashboard</a>

<a href="tenants.html" class="block hover:text-yellow-300 font-semibold">Tenants</a>

<a href="payments.html" class="block hover:text-yellow-300">Payments</a>

<a href="reported_issues.html" class="block hover:text-yellow-300">Reported Issues</a>

<a href="index.html" class="block hover:text-yellow-300 mt-6">Logout</a>

</nav>

</aside>
<div class="overflow-x-auto bg-white shadow rounded-lg">

  <table class="min-w-[900px] w-full text-sm text-left border-collapse">

    <!-- HEADER -->
    <thead class="bg-red-900 text-white">
      <tr>
        <th class="p-3">Full Name</th>
        <th class="p-3">Email</th>
        <th class="p-3">House Number</th>
        <th class="p-3">Subject</th>
        <th class="p-3">Message</th>
        <th class="p-3">Date</th>
      </tr>
    </thead>

    <!-- BODY -->
    <tbody id="issuesTableBody">
      <!-- JS will inject rows here -->
    </tbody>

  </table>

</div>

</div>
<!-- SCRIPT -->
<script>

const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

function toggleMenu() {
  sidebar.classList.toggle("-translate-x-full");
  overlay.classList.toggle("hidden");
}

menuBtn.addEventListener("click", toggleMenu);
overlay.addEventListener("click", toggleMenu);

</script>

<script type="module" src="js-files/issuesdisplay.js"></script>
</body>
</html>
