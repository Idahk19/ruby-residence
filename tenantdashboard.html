<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruby Residence Dashboard</title>

<script src="https://kit.fontawesome.com/3f286a15d5.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- TOP NAVBAR (PUBLIC) -->
<header class="bg-red-900 text-white">
<nav class="bg-red-900 text-white">

  <div class="max-w-3xl mx-auto p-2">

    <!-- WELCOME -->
   <h2 id="welcomeUser"></h2>
   <p id="userEmail"></p>
   <p id="userHouse"></p>


  </div>

</nav>

</header>

<!-- MOBILE TOP BAR -->
<div class="md:hidden bg-red-900 text-white flex justify-between items-center p-4">
    <button id="menuBtn" class="text-2xl">
    <i class="fa-solid fa-bars"></i>
  </button>

</div>
<!-- DASHBOARD LAYOUT -->
<div class="flex flex-col md:flex-row min-h-screen">

  <!-- SIDEBAR (TENANT MENU) -->
<aside id="sidebar"
  class="fixed w-64 h-full bg-red-950 text-white p-6 space-y-6  bg-black/50 z-40 transform -translate-x-full md:translate-x-0 md:static md:h-auto transition duration-300 ">

    <h2 class="text-xl font-bold">Idah's Menu</h2>

    <nav class="space-y-4 text-sm">
       <a href="index.html" class="hover:text-yellow-300">Home</a>
      
      <a href="contact.html" class="hover:text-yellow-300">Report Issues</a>


      <a href="#dashboard" class="block hover:text-yellow-300">
        <i class="fa-solid fa-gauge mr-2"></i> Dashboard
      </a>

      <a href="notices.html" class="block hover:text-yellow-300">
        <i class="fa-solid fa-bullhorn mr-2"></i> Notices
      </a>

      <a href="reported_issues.html" class="block hover:text-yellow-300">
        <i class="fa-solid fa-triangle-exclamation mr-2"></i> Reported Issues
      </a>

      <a href="index.html" class="block hover:text-yellow-300 mt-6">
        Logout
      </a>

    </nav>

  </aside>


  <!-- MAIN CONTENT -->
  <main class="flex-1 p-8 space-y-10">
<!-- DASHBOARD -->
<section id="dashboard" class="bg-white p-6 rounded-lg shadow">

  <h2 class="text-2xl font-bold text-red-900">
    Tenant Monthly Bills
  </h2>

  <p class="text-gray-600 mt-2 mb-6">
    Overview of rent and utility payments for this month
  </p>

  
 <table class="w-full text-sm text-left border-collapse">
    <thead class="bg-red-900 text-white">
        <tr>
            <th class="p-3">Type</th>
            <th class="p-3">Amount</th>
            <th class="p-3">Status</th>
            <th class="p-3">Due Date</th>
        </tr>
    </thead>

    <tbody id="tenantBillsBody">
    </tbody>
</table>
</section>

  </main>

</div>
<!-- SCRIPT -->
<script>
 document.addEventListener("DOMContentLoaded", () => {

    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    function toggleMenu() {
        sidebar.classList.toggle("-translate-x-full");
        overlay.classList.toggle("hidden");
    }

    if (menuBtn) menuBtn.addEventListener("click", toggleMenu);
    if (overlay) overlay.addEventListener("click", toggleMenu);

});
</script>
<script type="module"    src="js-files/tenantdash.js"></script>
</body>

</html>
