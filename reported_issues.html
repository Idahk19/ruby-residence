<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Issues</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://kit.fontawesome.com/3f286a15d5.js"></script>
</head>

<body class="bg-gray-100">
<header class="bg-red-900 text-white p-4">
    <h1 class="text-xl font-bold text-center">
        Ruby Residence 
    </h1>
</header>

<!-- MOBILE TOP BAR -->
<div class="md:hidden bg-red-900 text-white flex justify-between items-center p-4">
    <button id="menuBtn" class="text-2xl">
        <i class="fa-solid fa-bars"></i>
    </button>
</div>

<!-- OVERLAY -->
<div id="overlay"
class="hidden fixed inset-0 bg-black bg-opacity-70 z-40"></div>

<!-- MAIN LAYOUT -->
<div class="flex flex-col md:flex-row min-h-screen">

<!-- SIDEBAR -->
<aside id="sidebar"
class="fixed w-64 h-full bg-gradient-to-b from-red-950 to-red-900 text-white p-6
space-y-6 transform -translate-x-full md:translate-x-0 md:static
transition duration-300 z-50 shadow-xl">

   

    <!-- MENU -->
    <nav class="space-y-2 text-sm">

        <a href="index.html"
           class="flex items-center gap-3 p-3 rounded-lg hover:bg-red-800 transition">
            <i class="fa-solid fa-house"></i> Home
        </a>

        <a href="contact.html"
           class="flex items-center gap-3 p-3 rounded-lg hover:bg-red-800 transition">
            <i class="fa-solid fa-message"></i> Report Issues
        </a>

        <a href="notices.html"
           class="flex items-center gap-3 p-3 rounded-lg hover:bg-red-800 transition">
            <i class="fa-solid fa-bullhorn"></i> Notices
        </a>

        <a href="reported_issues.html"
           class="flex items-center gap-3 p-3 rounded-lg hover:bg-red-800 transition">
            <i class="fa-solid fa-triangle-exclamation"></i> Issues
        </a>


        <a href="index.html"
           class="flex items-center gap-3 p-3 rounded-lg hover:bg-red-700 text-red-200">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>

    </nav>

</aside>


<!-- MAIN CONTENT -->
<main class="flex-1 p-6 space-y-6">

  <!-- PAGE TITLE -->
  <div>
    <h2 class="text-3xl font-bold text-center text-red-900">
      My Reported Issues
    </h2>

    <p class="text-gray-600 text-center mt-2">
      Track reported apartment issues and management responses.
    </p>
  </div>

   <div class="bg-white shadow rounded-lg w-full overflow-x-auto">

    <table class="min-w-[900px] w-full text-sm text-left border-collapse">

      <!-- HEADER -->
      <thead class="bg-red-900 text-white">
        <tr>
       
          <th class="p-3">Subject</th>
          <th class="p-3">Message</th>
          <th class="p-3">Date</th>
          <th class="p-4">Action</th>
        </tr>
      </thead>

      <tbody id="issuesTableBody"></tbody>

    </table>

  </div>

</main>

<!-- SCRIPT -->
<script>
  const menuBtn = document.getElementById("menuBtn");
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");

  function toggleMenu() {
    sidebar.classList.toggle("-translate-x-full");
    overlay.classList.toggle("hidden");
  }

  menuBtn.addEventListener("click", toggleMenu);
  overlay.addEventListener("click", toggleMenu);
</script>
<script src="js-files/tenantissuesdash.js" type="module"></script>
</body>
</html>
